
<!DOCTYPE html>
<html>
<head>
    <title>CSS Fonts</title>
    <style>
        h1 {
            font-family: Georgia;
            font-size: 35px;
            color: purple;
        }

        p {
            font-family: Arial;
            font-size: 18px;
            font-style: italic;
        }
    </style>
</head>
<body>

    <h1>CSS Fonts</h1>
    <p>CSS can change the font family, size and style.</p>

</body>
</html>
