
<!DOCTYPE html>
<html>
<head>
    <title>CSS Layout</title>
    <style>
        .container {
            display: flex;
            gap: 20px;
        }

        .box {
            background-color: lightgreen;
            padding: 30px;
            width: 150px;
            text-align: center;
            border: 2px solid green;
        }
    </style>
</head>
<body>

    <h1>CSS Layout Example</h1>

    <div class="container">
        <div class="box">HTML</div>
        <div class="box">CSS</div>
        <div class="box">JavaScript</div>
    </div>

</body>
</html>
