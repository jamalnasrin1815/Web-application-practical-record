<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>React Props and State Example</title>
    <script src="https://unpkg.com" crossorigin></script>
    <script src="https://unpkg.com" crossorigin></script>
    <script src="https://unpkg.com"></script>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f3f4f6;
            padding: 40px;
            text-align: center;
        }
        .product-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            max-width: 300px;
            margin: 20px auto;
        }
        button {
            background-color: #059669;
            color: white;
            border: none;
            padding: 6px 12px;
            margin: 5px;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #047857;
        }
    </style>
</head>
<body>

    <div id="root"></div>

    <script type="text/text/babel">

        // Product Component (Props & State కలిపి ఉంటుంది)
        function Product(props) {
            // State initialization
            const [quantity, setQuantity] = React.useState(1);

            // Event Handlers
            const addQuantity = () => setQuantity(quantity + 1);
            const removeQuantity = () => {
                if (quantity > 1) setQuantity(quantity - 1);
            }

            return (
                <div className="product-card">
                    {/* Props - పంపించిన డేటా ఇక్కడ డిస్ప్లే అవుతుంది */}
                    <h2>{props.title}</h2>
                    <p><b>Category:</b> {props.category}</p>
                    <p><b>Price:</b> ₹{props.price}</p>
                    <hr />

                    {/* State - మారుతుండే వాల్యూ */}
                    <h3>Quantity: {quantity}</h3>
                    <p><b>Total Price:</b> ₹{props.price * quantity}</p>

                    {/* Event Handling Buttons */}
                    <button onClick={addQuantity}>+ Add</button>
                    <button onClick={removeQuantity}>- Remove</button>
                </div>
            );
        }

        // Main App Component
        function App() {
            return (
                <div>
                    <h1>Shopping Cart Example</h1>
                    
                    {/* ఇక్కడ మనం వేర్వేరు డేటాతో Props పాస్ చేయవచ్చు */}
                    <Product title="Smart Watch" category="Electronics" price={2500} />
                    <Product title="Running Shoes" category="Footwear" price={1800} />
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);

    </script>

</body>
</html>
