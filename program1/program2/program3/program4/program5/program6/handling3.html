
import React, { useState } from "react";
import ReactDOM from "react-dom/client";

function Counter() {

    const [count, setCount] = useState(0);

    return (
        <div>
            <h2>Counter</h2>

            <p>Count: {count}</p>

            <button onClick={() => setCount(count + 1)}>
                Increase
            </button>
        </div>
    );
}

const root = ReactDOM.createRoot(
    document.getElementById("root")
);

root.render(<Counter />);
