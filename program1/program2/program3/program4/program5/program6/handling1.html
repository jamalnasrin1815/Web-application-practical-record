<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>React Props, State, and Event Handling</title>
    <!-- Include React and Babel CDN libraries to run React in the browser -->
    <script src="https://unpkg.com" crossorigin></script>
    <script src="https://unpkg.com" crossorigin></script>
    <script src="https://unpkg.com"></script>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        h1 {
            color: #1e3a8a;
            text-align: center;
        }
        .card {
            background-color: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            margin: 20px auto;
        }
        h2 {
            color: #333;
            border-bottom: 1px solid #e5e7eb;
            padding-bottom: 8px;
        }
        button {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 8px 16px;
            margin-right: 8px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }
        button:hover {
            background-color: #1d4ed8;
        }
        .count {
            font-size: 24px;
            font-weight: bold;
            margin: 12px 0;
        }
    </style>
</head>

<body>

    <div id="root"></div>

    <script type="text/text/babel">

        // Student component using Props
        function Student(props) {

            // State
            const [count, setCount] = React.useState(0);

            // Event handling functions
            function increase() {
                setCount(count + 1);
            }

            function decrease() {
                setCount(count - 1);
            }

            function reset() {
                setCount(0);
            }

            return (
                <div className="card">
                    <h2>Student Information</h2>

                    {/* Props */}
                    <p><b>Name:</b> {props.name}</p>
                    <p><b>Department:</b> {props.department}</p>
                    <p><b>Year:</b> {props.year}</p>

                    <hr />

                    <h2>Counter</h2>

                    {/* State */}
                    <p className="count">{count}</p>

                    {/* Event Handling */}
                    <button onClick={increase}>
                        Increase
                    </button>

                    <button onClick={decrease}>
                        Decrease
                    </button>

                    <button onClick={reset}>
                        Reset
                    </button>
                </div>
            );
        }

        // Main App component
        function App() {
            return (
                <div>
                    <h1>React Props, State and Event Handling</h1>
                    
                    {/* Passing Props based on the Output image */}
                    <Student 
                        name="John" 
                        department="Computer Science" 
                        year="3rd Year" 
                    />
                </div>
            );
        }

        const root = ReactDOM.createRoot(
            document.getElementById("root")
        );
        root.render(<App />);

    </script>

</body>
</html>
