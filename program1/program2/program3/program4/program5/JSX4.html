
import React, { useState } from "react";
import ReactDOM from "react-dom/client";

function Counter() {

    const [count, setCount] = useState(0);

    return (
        <div>
            <h1>Counter App</h1>

            <h2>Count: {count}</h2>

            <button onClick={() => setCount(count + 1)}>
                Increase
            </button>

            <button onClick={() => setCount(count - 1)}>
                Decrease
            </button>
        </div>
    );
}

function App() {
    return <Counter />;
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
