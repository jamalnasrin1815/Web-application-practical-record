
<!DOCTYPE html>
<html>
<head>
    <title>DOM Example</title>
</head>
<body>

    <h2 id="heading">Welcome to JavaScript</h2>

    <button onclick="changeText()">Click Me</button>

    <script>
        function changeText() {
            document.getElementById("heading").textContent =
                "Hello! Text has been changed.";
        }
    </script>

</body>
</html>
